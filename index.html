<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOLIALE</title>

<link rel="preconnect" href="https://my.spline.design">

<style>



/* =========================
   SOCIAL BUTTONS
========================= */

/* =========================
   STATIC GLASS SOCIAL BUTTONS
========================= */

.social-buttons {

    position:absolute;

    z-index:10;

    bottom:80px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:25px;

}



.social-btn {

    position:relative;

    min-width:150px;

    padding:14px 34px;


    display:flex;

    justify-content:center;

    align-items:center;


    font-family:'JetBrains Mono', monospace;

    font-size:14px;

    letter-spacing:.25em;


    color:#aaa;

    text-decoration:none;


    border:1px solid rgba(255,255,255,.2);

    border-radius:50px;


    background:

    rgba(255,255,255,.04);


    backdrop-filter:blur(15px);

    -webkit-backdrop-filter:blur(15px);


    transition:none;


}


/* no hover animation */

.social-btn:hover {

    color:#fff;

    transform:none;

    box-shadow:none;

    border-color:rgba(255,255,255,.2);

}
/* =========================
   STATIC GLASS SOCIAL LOGOS
========================= */


/* =========================
   ANIMATED GLASS HOLOGRAM LOGOS
========================= */


.social-btn::after {

    content:"";

    position:absolute;


    width:90px;

    height:90px;


    left:50%;

    top:50%;


    transform:
    translate(-50%,-50%);


    z-index:-1;


    background:white;


    opacity:.35;


    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;


    -webkit-mask-position:center;
    mask-position:center;


    -webkit-mask-size:55%;
    mask-size:55%;


    animation:
    logoFloat 5s ease-in-out infinite;


}



@keyframes logoFloat {


    0%,100% {

        transform:
        translate(-50%,-50%)
        scale(1);


        opacity:.25;

    }


    50% {

        transform:
        translate(-50%,-58%)
        scale(1.12);


        opacity:.55;

    }


}



/* DISCORD */

.social-btn:nth-child(1)::after {
	animation-delay:0s;

    -webkit-mask-image:url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg");

    mask-image:url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg");


    filter:

    drop-shadow(0 0 18px #5865f2);

}



/* GITHUB */

.social-btn:nth-child(2)::after {
	animation-delay:1.5s;

    -webkit-mask-image:url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg");

    mask-image:url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg");


    filter:

    drop-shadow(0 0 18px white);

}



/* SPOTIFY */

.social-btn:nth-child(3)::after {
	animation-delay:s;

    -webkit-mask-image:url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/spotify.svg");

    mask-image:url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/spotify.svg");


    filter:

    drop-shadow(0 0 18px #1ed760);

}


/* mobile */

@media(max-width:700px){

.social-buttons{

    flex-direction:column;

}

}

.social-btn{

    padding:12px 25px;

}

}
/* =========================
   CUSTOM INVERT CURSOR
========================= */

html,
body,
* {
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
}


.custom-cursor {

    position: fixed;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 99999;


    backdrop-filter: invert(1);
    -webkit-backdrop-filter: invert(1);


    border: 1px solid rgba(255,255,255,.9);

    transform: translate(-50%, -50%);


    transition:
    width .25s ease,
    height .25s ease;

}


.custom-cursor::after {

    content:"";

    position:absolute;

    inset:-10px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.25);

    animation:
    cursorPulse 2s infinite;

}


@keyframes cursorPulse {

    0% {
        opacity:.25;
        transform:scale(.8);
    }

    50% {
        opacity:1;
        transform:scale(1);
    }

    100% {
        opacity:.25;
        transform:scale(.8);
    }

}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020202;
}


/* FALLBACK */

.spline-fallback {

    position:absolute;
    inset:0;
    z-index:0;

    background:
    radial-gradient(
        circle at center,
        #242424 0%,
        #090909 45%,
        #020202 100%
    );

}


/* SPLINE */

.spline-container {

    position:absolute;
    inset:0;

    z-index:1;

    opacity:0;

    transition:opacity 1.5s ease;

}


.spline-container.loaded {

    opacity:1;

}


.spline-container iframe {

    width:100%;
    height:100%;
    border:none;

}



/* ADVANCED VFX */

.vfx {

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    overflow:hidden;


    background:

    repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 4px,
        rgba(255,255,255,.025) 5px
    ),

    radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,.55) 100%
    );


    animation:hologramShift 12s infinite linear;

}



/* ENERGY GLOW */

.vfx::before {

    content:"";

    position:absolute;

    width:900px;

    height:900px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);


    background:

    radial-gradient(
        circle,
        rgba(255,255,255,.22),
        rgba(255,255,255,.05) 35%,
        transparent 70%
    );


    filter:blur(100px);


    animation:

    energyPulse 8s infinite alternate;

}



/* PARTICLES */

.vfx::after {

    content:"";

    position:absolute;

    inset:-100%;


    background-image:

    radial-gradient(
        circle,
        rgba(255,255,255,.5) 1px,
        transparent 2px
    ),

    radial-gradient(
        circle,
        rgba(255,255,255,.25) 2px,
        transparent 3px
    );


    background-size:

    90px 90px,
    170px 170px;


    opacity:.35;


    animation:

    particleMove 35s linear infinite;

}



/* LIGHT BEAM */

.vfx-beam {

    position:absolute;

    z-index:2;

    pointer-events:none;


    width:3px;

    height:120%;


    left:50%;

    top:-10%;


    background:

    linear-gradient(
        transparent,
        rgba(255,255,255,.65),
        transparent
    );


    filter:blur(5px);


    opacity:.3;


    animation:

    beamMove 7s ease-in-out infinite alternate;

}




@keyframes energyPulse {

    from {

        opacity:.35;

        transform:
        translate(-50%,-50%)
        scale(.8);

    }


    to {

        opacity:.9;

        transform:
        translate(-50%,-50%)
        scale(1.25);

    }

}



@keyframes particleMove {

    from {

        transform:
        translateY(-100px)
        rotate(0deg);

    }


    to {

        transform:
        translateY(300px)
        rotate(180deg);

    }

}



@keyframes beamMove {

    from {

        transform:
        translateX(-250px)
        rotate(8deg);

    }


    to {

        transform:
        translateX(250px)
        rotate(-8deg);

    }

}



@keyframes hologramShift {

    0% {

        filter:
        brightness(1)
        contrast(1);

    }


    50% {

        filter:
        brightness(1.1)
        contrast(1.15);

    }


    100% {

        filter:
        brightness(1)
        contrast(1);

    }

}




/* LOGO */

.ta-18 {

    position:relative;

    z-index:5;

    width:100%;

    height:100vh;


    display:flex;

    justify-content:center;

    align-items:center;


    font-family:
    'JetBrains Mono',
    monospace;

}



.ta-18__text {

    display:flex;

    font-size:
    clamp(3rem,9vw,6rem);


    font-weight:700;


    letter-spacing:.18em;

}



.ta-18__char {

    color:#555;

    transition:
    color .5s ease,
    text-shadow .5s ease;

}



.ta-18__char.resolved {

    color:#fff;


    text-shadow:

    0 0 10px rgba(255,255,255,.9),

    0 0 35px rgba(255,255,255,.45);

}



/* =========================
   TOP MARQUEE
========================= */

.top-ticker{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:42px;

    display:flex;
    align-items:center;

    overflow:hidden;

    color:#fff;

    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);

    border-bottom:1px solid rgba(255,255,255,.12);

    box-shadow:
        inset 0 1px rgba(255,255,255,.12),
        0 8px 30px rgba(0,0,0,.25);

    z-index:9999;

    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:.35em;
    text-transform:uppercase;
}

.ticker-track{
    display:flex;
    width:max-content;
    white-space:nowrap;

    color:rgba(255,255,255,.9);

    text-shadow:
        0 0 8px rgba(255,255,255,.35),
        0 0 18px rgba(255,255,255,.15);

    animation:ticker 18s linear infinite;

}

.ticker-track span{
    padding-right:120px;
}

@keyframes ticker{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}


/* FLOATING GLASS HOLOGRAM */

.social-btn::after {



@keyframes hologramIcon {


    0%,100% {

        opacity:.25;

        transform:
        translate(-50%,-50%)
        scale(1);

        filter:
        invert(1)
        blur(.2px)
        drop-shadow(0 0 15px white);

    }


    50% {

        opacity:.65;

        transform:
        translate(-50%,-65%)
        scale(1.15);


    }

}



</style>

</head>
<div class="custom-cursor" id="cursor"></div>

<body>

</div>





<div class="spline-fallback"></div>


<div class="spline-container" id="spline">

<iframe
src="https://my.spline.design/3dgradient-AcpgG6LxFkpnJSoowRHPfcbO"
frameborder="0">
</iframe>

</div>


<div class="vfx"></div>

<div class="vfx-beam"></div>



<div class="ta-18">

<h2 class="ta-18__text" id="text"></h2>

</div>


<div class="social-buttons">

    <a href="http://discordapp.com/users/927281700495573002" target="_blank" class="social-btn">
        DISCORD
    </a>

    <a href="https://github.com/soliale" target="_blank" class="social-btn">
        GITHUB
    </a>

    <a href="https://open.spotify.com/user/31fzahuwt6fwxsrq5inrcshvh3ce" target="_blank" class="social-btn">
        SPOTIFY
    </a>

</div>

<div class="top-ticker">
    <div class="ticker-track">
        <span>
            SOLIALE // SOLIALE // SOLIALE // SOLIALE //
            SOLIALE // SOLIALE // SOLIALE // SOLIALE //
        </span>

        <span>
            SOLIALE // SOLIALE // SOLIALE // SOLIALE //
            SOLIALE // SOLIALE // SOLIALE // SOLIALE //
        </span>
    </div>
</div>




<script>


const spline=document.getElementById("spline");

const iframe=spline.querySelector("iframe");


iframe.onload=()=>{

setTimeout(()=>{

spline.classList.add("loaded");

},1200);

};


setTimeout(()=>{

spline.classList.add("loaded");

},6000);




const el=document.getElementById("text");

const finalText="SOLIALE";


const chars =
"!@#$%^&*<>?/|\\[]{}ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";



function scramble(){

el.innerHTML="";

let letters=[];


[...finalText].forEach(letter=>{


let span=document.createElement("span");

span.className="ta-18__char";

span.textContent=
chars[Math.floor(Math.random()*chars.length)];


el.appendChild(span);


letters.push({

el:span,

final:letter,

done:false

});


});



let tick=0;


let timer=setInterval(()=>{


tick++;

let finished=true;


letters.forEach((item,index)=>{


if(item.done)return;


if(tick>=6+index*4){


item.el.textContent=item.final;

item.el.classList.add("resolved");

item.done=true;


}else{


item.el.textContent=
chars[Math.floor(Math.random()*chars.length)];

finished=false;


}


});



if(finished){

clearInterval(timer);

setTimeout(glitch,4000);

}


},65);


}



function glitch(){


const letters=document.querySelectorAll(".ta-18__char");

let count=0;


let timer=setInterval(()=>{


letters.forEach(letter=>{


if(Math.random()>.4){


letter.textContent=
chars[Math.floor(Math.random()*chars.length)];


letter.style.color="#fff";


}


});


count++;


if(count>10){


clearInterval(timer);


letters.forEach((letter,index)=>{


setTimeout(()=>{


letter.textContent=finalText[index];

letter.classList.add("resolved");


},index*70);


});


setTimeout(glitch,4000);


}


},70);


}



scramble();

const cursor = document.getElementById("cursor");
/* =========================
   CUSTOM CURSOR
========================= */

/* =========================
   SOCIAL BUTTON CURSOR FX
========================= */


document.querySelectorAll(".social-btn").forEach(button=>{


button.addEventListener("mouseenter",()=>{


    cursor.style.width="70px";

    cursor.style.height="70px";


});


button.addEventListener("mouseleave",()=>{


    cursor.style.width="34px";

    cursor.style.height="34px";


});


});




document.addEventListener("mousemove", e => {

    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";

});



/* Remove highlighting */

document.addEventListener("selectstart", e => {

    e.preventDefault();

});



/* Remove right click */

document.addEventListener("contextmenu", e => {

    e.preventDefault();

});



/* Block copy/select shortcuts */

document.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();


    if (

        (e.ctrlKey &&
        ["a","c","x","s","u"].includes(key))

        ||

        e.key === "F12"

        ||

        (e.ctrlKey &&
        e.shiftKey &&
        key === "i")

    ) {

        e.preventDefault();

    }

});





/* Cursor grows over logo */

const logo = document.querySelector(".ta-18__text");


logo.addEventListener("mouseenter",()=>{

    cursor.style.width="60px";
    cursor.style.height="60px";

});


logo.addEventListener("mouseleave",()=>{

    cursor.style.width="34px";
    cursor.style.height="34px";

});


</script>


</body>
